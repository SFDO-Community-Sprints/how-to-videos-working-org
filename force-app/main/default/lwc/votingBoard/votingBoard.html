<template>
  <article class="slds-card">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__body">
          <h2 class="slds-card__header-title">Voting board</h2>
        </div>
        <div class="slds-no-flex">
          <button
            type="button"
            class="slds-button slds-button_neutral"
            onclick={handleRefresh}
          >
            Refresh ideas
          </button>
        </div>
      </header>
    </div>
    <div class="slds-card__body slds-card__body_inner">
      <p class="slds-m-bottom_small">
        The list keeps its order while you read. Refresh to see other people's
        votes and new ideas.
      </p>
      <div role="status" class="slds-assistive-text" data-id="announcer">
        {announcement}
      </div>
      <template lwc:if={loading}>
        <p>Loading ideas.</p>
      </template>
      <template lwc:elseif={loadError}>
        <p role="alert">The ideas could not be loaded. {loadError}</p>
      </template>
      <template lwc:elseif={hasIdeas}>
        <ul aria-label="Ideas">
          <template for:each={rows} for:item="idea">
            <li key={idea.id} class="slds-p-vertical_small slds-border_bottom">
              <h3 class="slds-text-heading_small">
                <a href={idea.url}>{idea.title}</a>
              </h3>
              <p class="slds-m-vertical_x-small">{idea.summary}</p>
              <button
                type="button"
                class={idea.buttonClass}
                data-id={idea.id}
                aria-disabled={idea.busy}
                onclick={handleToggle}
              >
                {idea.action}<span class="slds-assistive-text"
                  >{idea.forTitle}</span
                >
              </button>
            </li>
          </template>
        </ul>
      </template>
      <template lwc:else>
        <p>There are no ideas to vote on.</p>
      </template>
    </div>
  </article>
</template>
